networks:
  identity-network:
    name: identity-network

volumes:
  peer0.gov.identity.example.com:
  peer1.gov.identity.example.com:
  peer0.university.example.com:
  peer1.university.example.com:
  peer0.bank.example.com:
  peer1.bank.example.com:
  peer0.employer.example.com:
  peer1.employer.example.com:

services:
  peer0.gov.identity.example.com:
    image: hyperledger/fabric-peer:2.5.16
    container_name: peer0.gov.identity.example.com
    environment:
      - FABRIC_CFG_PATH=/etc/hyperledger/fabric
      - FABRIC_LOGGING_SPEC=INFO
      - CORE_PEER_TLS_ENABLED=true
      - CORE_PEER_PROFILE_ENABLED=false
      - CORE_PEER_TLS_CERT_FILE=/etc/hyperledger/fabric/tls/server.crt
      - CORE_PEER_TLS_KEY_FILE=/etc/hyperledger/fabric/tls/server.key
      - CORE_PEER_TLS_ROOTCERT_FILE=/etc/hyperledger/fabric/tls/ca.crt
      - CORE_PEER_ID=peer0.gov.identity.example.com
      - CORE_PEER_ADDRESS=peer0.gov.identity.example.com:7051
      - CORE_PEER_LISTENADDRESS=0.0.0.0:7051
      - CORE_PEER_CHAINCODEADDRESS=peer0.gov.identity.example.com:7052
      - CORE_PEER_CHAINCODELISTENADDRESS=0.0.0.0:7052
      - CORE_PEER_GOSSIP_BOOTSTRAP=peer1.gov.identity.example.com:7051
      - CORE_PEER_GOSSIP_EXTERNALENDPOINT=peer0.gov.identity.example.com:7051
      - CORE_PEER_LOCALMSPID=GovMSP
      - CORE_PEER_MSPCONFIGPATH=/etc/hyperledger/fabric/msp
      - CORE_OPERATIONS_LISTENADDRESS=0.0.0.0:9444
      - CORE_METRICS_PROVIDER=prometheus
      - CORE_LEDGER_STATE_STATEDATABASE=CouchDB
      - CORE_LEDGER_STATE_COUCHDBCONFIG_COUCHDBADDRESS=couchdb0.gov:5984
      - CORE_LEDGER_STATE_COUCHDBCONFIG_USERNAME=admin
      - CORE_LEDGER_STATE_COUCHDBCONFIG_PASSWORD=adminpw
      - CORE_VM_ENDPOINT=unix:///host/var/run/docker.sock
      - CORE_VM_DOCKER_HOSTCONFIG_NETWORKMODE=identity-network
    working_dir: /opt/gopath/src/github.com/hyperledger/fabric/peer
    command: peer node start
    volumes:
      - ../organizations/peerOrganizations/gov.identity.example.com/peers/peer0.gov.identity.example.com/msp:/etc/hyperledger/fabric/msp
      - ../organizations/peerOrganizations/gov.identity.example.com/peers/peer0.gov.identity.example.com/tls:/etc/hyperledger/fabric/tls
      - peer0.gov.identity.example.com:/var/hyperledger/production
      - /var/run/docker.sock:/host/var/run/docker.sock
    ports:
      - "7051:7051"
      - "9444:9444"
    networks:
      - identity-network

