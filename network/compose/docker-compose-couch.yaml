# ==============================================================================
# Hyperledger Fabric State Database (CouchDB) Topology - Milestone 9 Hardened
#
# SECURITY NOTICE (SEC-DB-01):
# 1. Ports are bound strictly to loopback (127.0.0.1) to prevent administrative
#    HTTP interface exposure on public or external network interfaces.
# 2. In production, credentials (admin:adminpw) must be injected via Docker secrets
#    or vault management. Current credentials are prototype-only.
# ==============================================================================
networks:
  identity-network:
    name: identity-network

services:
  couchdb0.gov:
    image: couchdb:3.3.3
    container_name: couchdb0.gov
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "127.0.0.1:5984:5984"
    networks:
      - identity-network

  couchdb1.gov:
    image: couchdb:3.3.3
    container_name: couchdb1.gov
    environment:
      - COUCHDB_USER=admin
      - COUCHDB_PASSWORD=adminpw
    ports:
      - "127.0.0.1:5985:5984"
    networks:
      - identity-network

