---
Organizations:
  - &OrdererOrgGov
    Name: OrdererOrgGov
    ID: OrdererOrgGovMSP
    MSPDir: ../organizations/ordererOrganizations/gov.identity.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererOrgGovMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererOrgGovMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererOrgGovMSP.admin')"

  - &OrdererOrgUni
    Name: OrdererOrgUni
    ID: OrdererOrgUniMSP
    MSPDir: ../organizations/ordererOrganizations/university.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererOrgUniMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererOrgUniMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererOrgUniMSP.admin')"

  - &OrdererOrgBank
    Name: OrdererOrgBank
    ID: OrdererOrgBankMSP
    MSPDir: ../organizations/ordererOrganizations/bank.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('OrdererOrgBankMSP.member')"
      Writers:
        Type: Signature
        Rule: "OR('OrdererOrgBankMSP.member')"
      Admins:
        Type: Signature
        Rule: "OR('OrdererOrgBankMSP.admin')"

  - &GovMSP
    Name: GovMSP
    ID: GovMSP
    MSPDir: ../organizations/peerOrganizations/gov.identity.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('GovMSP.admin', 'GovMSP.peer', 'GovMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('GovMSP.admin', 'GovMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('GovMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('GovMSP.peer')"
    AnchorPeers:
      - Host: peer0.gov.identity.example.com
        Port: 7051

  - &UniversityMSP
    Name: UniversityMSP
    ID: UniversityMSP
    MSPDir: ../organizations/peerOrganizations/university.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('UniversityMSP.admin', 'UniversityMSP.peer', 'UniversityMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('UniversityMSP.admin', 'UniversityMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('UniversityMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('UniversityMSP.peer')"
    AnchorPeers:
      - Host: peer0.university.example.com
        Port: 8051

  - &BankMSP
    Name: BankMSP
    ID: BankMSP
    MSPDir: ../organizations/peerOrganizations/bank.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('BankMSP.admin', 'BankMSP.peer', 'BankMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('BankMSP.admin', 'BankMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('BankMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('BankMSP.peer')"
    AnchorPeers:
      - Host: peer0.bank.example.com
        Port: 9051

  - &EmployerMSP
    Name: EmployerMSP
    ID: EmployerMSP
    MSPDir: ../organizations/peerOrganizations/employer.example.com/msp
    Policies:
      Readers:
        Type: Signature
        Rule: "OR('EmployerMSP.admin', 'EmployerMSP.peer', 'EmployerMSP.client')"
      Writers:
        Type: Signature
        Rule: "OR('EmployerMSP.admin', 'EmployerMSP.client')"
      Admins:
        Type: Signature
        Rule: "OR('EmployerMSP.admin')"
      Endorsement:
        Type: Signature
        Rule: "OR('EmployerMSP.peer')"
    AnchorPeers:
      - Host: peer0.employer.example.com
        Port: 10051

Capabilities:
  Channel: &ChannelCapabilities
    V2_0: true
  Orderer: &OrdererCapabilities
    V2_0: true
  Application: &ApplicationCapabilities
    V2_5: true

Application: &ApplicationDefaults
  Organizations:
  Policies:
    LifecycleEndorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Endorsement:
      Type: ImplicitMeta
      Rule: "MAJORITY Endorsement"
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ApplicationCapabilities

Orderer: &OrdererDefaults
  OrdererType: etcdraft
  Addresses:
    - orderer1.gov.identity.example.com:7050
    - orderer2.university.example.com:8050
    - orderer3.bank.example.com:9050
  BatchTimeout: 1s
  BatchSize:
    MaxMessageCount: 100
    AbsoluteMaxBytes: 10 MB
    PreferredMaxBytes: 2 MB
  EtcdRaft:
    Consenters:
      - Host: orderer1.gov.identity.example.com
        Port: 7050
        ClientTLSCert: ../organizations/ordererOrganizations/gov.identity.example.com/orderers/orderer1.gov.identity.example.com/tls/server.crt
        ServerTLSCert: ../organizations/ordererOrganizations/gov.identity.example.com/orderers/orderer1.gov.identity.example.com/tls/server.crt
      - Host: orderer2.university.example.com
        Port: 8050
        ClientTLSCert: ../organizations/ordererOrganizations/university.example.com/orderers/orderer2.university.example.com/tls/server.crt
        ServerTLSCert: ../organizations/ordererOrganizations/university.example.com/orderers/orderer2.university.example.com/tls/server.crt
      - Host: orderer3.bank.example.com
        Port: 9050
        ClientTLSCert: ../organizations/ordererOrganizations/bank.example.com/orderers/orderer3.bank.example.com/tls/server.crt
        ServerTLSCert: ../organizations/ordererOrganizations/bank.example.com/orderers/orderer3.bank.example.com/tls/server.crt
  Organizations:
    - *OrdererOrgGov
    - *OrdererOrgUni
    - *OrdererOrgBank
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
    BlockValidation:
      Type: ImplicitMeta
      Rule: "ANY Writers"
  Capabilities:
    <<: *OrdererCapabilities

Channel: &ChannelDefaults
  Policies:
    Readers:
      Type: ImplicitMeta
      Rule: "ANY Readers"
    Writers:
      Type: ImplicitMeta
      Rule: "ANY Writers"
    Admins:
      Type: ImplicitMeta
      Rule: "MAJORITY Admins"
  Capabilities:
    <<: *ChannelCapabilities

Profiles:
  IdentityChannel:
    <<: *ChannelDefaults
    Orderer:
      <<: *OrdererDefaults
      Organizations:
        - *OrdererOrgGov
        - *OrdererOrgUni
        - *OrdererOrgBank
      Capabilities: *OrdererCapabilities
    Application:
      <<: *ApplicationDefaults
      Organizations:
        - *GovMSP
        - *UniversityMSP
        - *BankMSP
        - *EmployerMSP
      Capabilities: *ApplicationCapabilities
